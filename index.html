<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Sign-up form</title>
        <meta charset="utf-8">
        <link rel="stylesheet" href="css/styles.css" type="text/css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div class="left-container">
            <div class="title-logo">

            </div>
        </div>
        <div class="right-container">
            <div class="description">
                <h1>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.
                    <br>
                    Sign up <em>now</em> to get started.
                </h1>
                <p>You <em>know</em> you want to.</p>
            </div>
            <div class="form-container">
                <p>Let's do this!</p>
                <form action="" method="post" class="sign-up-form">
                    <div class="form-row">
                        <div class="form-element">
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name" name="first-name" required>
                        </div>
                        <div class="form-element">
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name" name="last-name" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-element">
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="form-element">
                            <label for="phone-number">PHONE NUMBER</label>
                            <input type="text" id="phone-number" name="phone-number" required>
                        </div>
                    </div>
                   <div class="form-row">
                        <div class="form-element">
                            <label for="pwd">PASSWORD</label>
                            <input type="password" id="pwd" name="pwd" required>
                        </div>
                        <div class="form-element">
                            <label for="confirm-pwd">CONFIRM PASSWORD</label>
                            <input type="password" id="confirm-pwd" name="confirm-pwd" required>
                        </div>
                   </div>
                </form>
            </div>
            <div class="form-footer">
                <button>Create Account</button>
                <p>Already have an account? <a href="">Log in</a></p>
            </div>
        </div>
    </body>
</html>
